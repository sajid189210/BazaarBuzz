
name: Test EC2 SSH Connection

on:
  workflow_dispatch:

jobs:
  ssh-test:
    name: Verify EC2 Connection
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          echo "Checking runner..."
          whoami
          pwd

          echo "Creating SSH directory..."
          mkdir -p ~/.ssh

          echo "Checking directory..."
          ls -ld ~/.ssh

          echo "SSH directory created successfully!"
